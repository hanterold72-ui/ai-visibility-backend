services:
  - type: web
    name: ai-visibility-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: geo-redis
          type: redis
          property: connectionString
      - { key: PERPLEXITY_API_KEY, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: JWT_SECRET, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: SERVICE_API_KEY, sync: false }

  - type: worker
    name: ai-visibility-worker
    runtime: docker
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: geo-redis
          type: redis
          property: connectionString

  - type: pserv
    name: geo-db
    plan: free

  - type: redis
    name: geo-redis
    plan: free
